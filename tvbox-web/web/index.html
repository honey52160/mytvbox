<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TVBox Web</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="wallpaper" class="wallpaper" hidden></div>
  <header class="topbar">
    <div class="brand" data-nav="#/home">
      <span class="brand-logo">TV</span>
      <span class="brand-name">TVBox <em>Web</em></span>
    </div>
    <nav class="nav">
      <a data-nav="#/home" class="nav-item">首页</a>
      <a data-nav="#/live" class="nav-item">直播</a>
      <a data-nav="#/history" class="nav-item">历史</a>
      <a data-nav="#/fav" class="nav-item">收藏</a>
      <a data-nav="#/settings" class="nav-item">设置</a>
    </nav>
    <div class="topbar-right">
      <select id="siteSelect" class="site-select" title="切换站点"></select>
      <div class="search-box">
        <input id="globalSearch" type="search" placeholder="搜索影片…" autocomplete="off" />
        <button id="globalSearchBtn" title="搜索">⌕</button>
      </div>
    </div>
  </header>

  <div id="hostBanner" class="host-banner" hidden></div>

  <main id="view" class="view"></main>

  <div id="toast" class="toast" hidden></div>
  <div id="loading" class="loading" hidden><div class="spinner"></div></div>

  <script>
    // 启动期任何脚本错误直接上屏，避免白屏无线索
    window.addEventListener('error', function (e) {
      var v = document.getElementById('view');
      if (v && !v.children.length) {
        v.innerHTML = '<div class="empty"><div class="big">⚠</div><div>脚本错误：' +
          (e.message || e.error || e.type) + (e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : '') +
          '</div></div>';
      }
    });
  </script>
  <script src="/js/vendor/hls.min.js"></script>
  <script src="/js/vendor/mpegts.min.js"></script>
  <script src="/js/util.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/liveparse.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/views/home.js"></script>
  <script src="/js/views/search.js"></script>
  <script src="/js/views/detail.js"></script>
  <script src="/js/views/play.js"></script>
  <script src="/js/views/live.js"></script>
  <script src="/js/views/library.js"></script>
  <script src="/js/views/settings.js"></script>
  <script>TV.boot && TV.boot();</script>
</body>
</html>
